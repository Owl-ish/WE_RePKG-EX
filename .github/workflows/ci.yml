name: CI

on:
  push:
    # These are remote branch names. Pushing with `git push fork publish:master`
    # lands on master, which is what GitHub matches against; publish is listed
    # too in case the branch ever gets pushed under its own name.
    branches: [master, publish]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze & test (Dart)
    # windows-latest, not ubuntu: test/info_test.dart asserts on a Windows path
    # with backslashes, which package:path only parses as separators on Windows.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      # The build step below drives cargokit, which compiles the whole crate
      # graph. Without these it used the runner's stock toolchain and started
      # from cold on every push, while the Rust job beside it pinned and cached.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # --fatal-infos, or the lint set is decorative here: almost every
      # flutter_lints rule reports at info, and analyze only fails on warnings.
      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos

      - name: Test
        run: flutter test --no-pub --reporter=expanded

      # A break that only shows at build time, a plugin registration or an asset
      # path, otherwise lands on master green and turns up at release.
      - name: Build
        run: flutter build windows --debug

  rust:
    name: Test (Rust)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
