name: Release

on:
  push:
    # Release tags carry a v: v1.6, v1.7, v1.71. A tag without one, like the
    # original 1.5, does not match and builds nothing.
    tags: ['v*']
  # Lets a release be rebuilt by hand without moving a tag, e.g. when a run
  # failed for an infrastructure reason.
  workflow_dispatch:

# Needed to create the draft release and attach the zip to it.
permissions:
  contents: write

jobs:
  windows:
    name: Build Windows bundle
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The tag names the release; pubspec's version is what the About screen
      # shows, via PackInfo.getVersion(). Tagging without bumping pubspec ships
      # a build that misreports itself, and nothing at runtime would notice.
      #
      # Both sides are padded to three parts, so a v1.6 tag matches 1.6.0 and
      # the tag style stays a free choice. Runs before anything expensive.
      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          function Normalise([string]$v) {
            $parts = @((($v -split '\+')[0]) -split '\.')
            while ($parts.Count -lt 3) { $parts += '0' }
            ($parts[0..2]) -join '.'
          }
          $tag = Normalise ($env:GITHUB_REF -replace '^refs/tags/v?', '')
          $pubspec = Normalise ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value)
          Write-Host "tag: $tag / pubspec: $pubspec"
          if ($tag -ne $pubspec) {
            throw "Tag $tag does not match pubspec version $pubspec. The About screen shows pubspec's version, so bump pubspec.yaml and re-tag."
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      # RePKG is the actual unpacker; the app shells out to it. getToolPath()
      # in lib/utils/info.dart falls back to RePKG.exe sitting beside the app
      # executable
      #
      # RePKG is MIT, which permits redistribution as long as the licence text
      # travels with the binary, hence the LICENSE fetch below.
      - name: Fetch RePKG
        shell: pwsh
        env:
          # Must stay at or above the version repkgSupportsExtractFlags requires
          # in lib/utils/info.dart.
          REPKG_TAG: v0.5.2-ex
          REPKG_SHA256: 04f307877c49b825767b2855f7814be5840e87e7f0080d6138946fc2fd3b4b61
        run: |
          $url = "https://github.com/Owl-ish/RePKG-EX/releases/download/$env:REPKG_TAG/RePKG.zip"
          Invoke-WebRequest -Uri $url -OutFile RePKG.zip
          $actual = (Get-FileHash RePKG.zip -Algorithm SHA256).Hash
          if ($actual -ne $env:REPKG_SHA256) {
            throw "RePKG.zip does not match the pinned hash.`nExpected: $env:REPKG_SHA256`nActual:   $actual`nUpstream changed the asset for $env:REPKG_TAG. Check what changed before updating REPKG_SHA256."
          }
          Write-Host "RePKG.zip SHA256 verified: $actual"
          Expand-Archive RePKG.zip -DestinationPath repkg-extracted
          # Searched for rather than assumed: the archive's internal layout is
          # upstream's business and has no reason to stay put across versions.
          $exe = Get-ChildItem repkg-extracted -Recurse -Filter RePKG.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "RePKG.exe not found inside RePKG.zip" }
          "REPKG_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          # Covers the libraries ILRepack merged into RePKG.exe (ImageSharp,
          # Newtonsoft.Json, K4os.LZ4, System.Drawing.Common), whose licences
          # would otherwise ship without their notices.
          $notices = Get-ChildItem repkg-extracted -Recurse -Filter THIRD-PARTY-NOTICES.txt |
                     Select-Object -First 1
          if (-not $notices) { throw "THIRD-PARTY-NOTICES.txt not found inside RePKG.zip" }
          "REPKG_NOTICES=$($notices.FullName)" >> $env:GITHUB_ENV
          # From our fork, which is what actually ships. Same MIT text it
          # inherited from notscuffed, whose copyright line it still carries.
          # HEAD resolves to the default branch, so this survives a rename.
          Invoke-WebRequest -Uri 'https://github.com/Owl-ish/RePKG-EX/raw/HEAD/LICENSE' -OutFile 'RePKG-LICENSE.txt'
      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $stem = "WeRePKG-EX-$tag-windows-x64"
          New-Item -ItemType Directory -Path $stem | Out-Null
          Copy-Item 'build\windows\x64\runner\Release\*' -Destination $stem -Recurse
          # Beside the exe, which is where getToolPath() looks.
          Copy-Item $env:REPKG_EXE -Destination $stem
          Copy-Item $env:REPKG_NOTICES -Destination "$stem\RePKG-THIRD-PARTY-NOTICES.txt"
          Copy-Item 'RePKG-LICENSE.txt' -Destination $stem
          Copy-Item 'LICENSE' -Destination "$stem\LICENSE.txt"
          Compress-Archive -Path $stem -DestinationPath "$stem.zip"
          "name=$stem.zip" >> $env:GITHUB_OUTPUT
          "stem=$stem"     >> $env:GITHUB_OUTPUT
          "tag=$tag"       >> $env:GITHUB_OUTPUT

      # Always available, including for workflow_dispatch runs that create no
      # release. Keeps a downloadable build even if the release step is skipped.
      #
      # Uploads the staged folder, not the zip: upload-artifact always zips what
      # it is given, so handing it the zip produced a zip inside a zip (and an
      # artifact literally named .zip.zip). The release asset below is the real
      # zip and is attached as-is.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.stem }}
          path: ${{ steps.package.outputs.stem }}

      # Draft, not published: the release notes are written by hand, so this
      # parks the zip on a draft and leaves publishing as a deliberate step.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # The tag already carries the v, so no prefix here.
          name: WeRePKG-EX ${{ steps.package.outputs.tag }}
          files: ${{ steps.package.outputs.name }}
